name: Production AI smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-smoke.yml"
      - "app/api/ai/**"
      - "app/lib/ai-client.ts"
      - "app/lib/server/ai-gateway.ts"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check explain and vocabulary-card capabilities
        shell: bash
        run: |
          set -euo pipefail

          explain_response="$(curl --location --fail-with-body --silent --show-error --max-time 30 \
            -X POST "https://lucid-dream-nu.vercel.app/api/ai" \
            -H "content-type: application/json" \
            --data '{"capability":"explain","selection":"visual rhythm","context":"The layout has visual rhythm."}')"
          node -e 'const body=JSON.parse(process.argv[1]); if(typeof body.text!=="string"||!body.text.trim()){console.error("Unexpected explain response:", body); process.exit(1)} console.log("Explain smoke test passed.")' "$explain_response"

          vocabulary_response="$(curl --location --fail-with-body --silent --show-error --max-time 45 \
            -X POST "https://lucid-dream-nu.vercel.app/api/ai" \
            -H "content-type: application/json" \
            --data '{"capability":"vocabulary-card","selection":"make sense","context":"The ending finally makes sense.","sourceLanguage":"en"}')"
          node -e 'const body=JSON.parse(process.argv[1]); for(const key of ["chineseMeaning","englishDefinition","pronunciation","example"]){ if(typeof body[key]!=="string"||!body[key].trim()){console.error("Unexpected vocabulary response:", body); process.exit(1)} } console.log("Vocabulary-card smoke test passed.")' "$vocabulary_response"
