name: Pack Vercel source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pack-vercel-source.yml"

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pack repository into small base64 chunks
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude='vercel-source.part-*' -czf /tmp/vercel-source.tgz .
          base64 -w0 /tmp/vercel-source.tgz > /tmp/vercel-source.b64
          rm -f vercel-source.part-*
          split -b 600000 -d -a 2 /tmp/vercel-source.b64 vercel-source.part-
          ls -lh vercel-source.part-*

      - name: Publish pack branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lucid-dream-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B deploy-pack
          git add -f vercel-source.part-*
          git commit -m "chore: pack source for Vercel handoff"
          git push --force origin deploy-pack
