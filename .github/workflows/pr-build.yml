name: PR build check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run environment-independent regression tests
        shell: bash
        run: |
          set -euo pipefail
          find tests -maxdepth 1 -name '*.test.mjs' ! -name 'rendered-html.test.mjs' -print0 \
            | xargs -0 node --test

      - name: Verify Next.js production build and type-check
        run: npx --no-install next build
